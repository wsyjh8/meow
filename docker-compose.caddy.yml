services:
  caddy:
    image: caddy:2-alpine
    container_name: meow-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-api.miaory.chat, miaory.chat}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
