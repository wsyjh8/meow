name: meow_mobile
description: "Meow - 背单词 + 云养猫 (Flutter Mobile Client)"
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path: ^1.8.0
  drift: ^2.32.1
  drift_sqflite: ^2.0.1
  fsrs: ^2.0.1
  path_provider: ^2.1.5
  device_info_plus: ^10.0.0
  audioplayers: ^6.0.0
  fl_chart: ^0.69.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0+4
  drift_dev: ^2.32.1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/words/book-001.json
    - assets/words/zk.json
    - assets/words/gk.json
    # Need #11 — bundled prebuilt SQLite seed for word enrichment
    # (forms / relations / phrases). Generated by
    # tools/build_enrichment_seed.dart from docs/forms/*.jsonl. The
    # JSONL files are no longer bundled — bootstrap copies this seed
    # and INSERTs in <1s instead of JSON-parsing 18MB on device.
    - assets/seed/enrichment_v2.db
